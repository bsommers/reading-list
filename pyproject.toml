[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-list"
version = "0.1.0"
description = "Semantic chunking, conceptual taxonomy categorization, word-cloud indexing, and knowledge graph linking for technical articles and academic papers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
reading-list = "reading_list.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
